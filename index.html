<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Tennis Logger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* ─── TOKENS ─────────────────────────────────────────── */
:root {
  --bg:        #0d0f14;
  --bg2:       #161a23;
  --bg3:       #1e2332;
  --border:    #2a3045;
  --fg:        #e8ecf4;
  --fg2:       #8c96b0;
  --accent:    #4f8ef7;
  --accent2:   #6c63ff;
  --green:     #2dcc6f;
  --red:       #e53e3e;
  --amber:     #f59e0b;
  --purple:    #9c6fe4;
  --pill-fh:   #166534;
  --pill-bh:   #1e3a6e;
  --pill-net:  #4c1d95;
  --pill-ace:  #14532d;
  --pill-df:   #7f1d1d;
  --pill-norm: #1e3a6e;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:  #f0f2f7; --bg2: #fff; --bg3: #e4e8f0;
    --border: #d0d5e0; --fg: #111827; --fg2: #6b7280;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg:  #f0f2f7; --bg2: #fff; --bg3: #e4e8f0;
  --border: #d0d5e0; --fg: #111827; --fg2: #6b7280;
  color-scheme: light;
}

/* ─── RESET ──────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: 'Inter', system-ui, sans-serif; font-size: 15px;
  min-height: 100vh;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
button {
  font-family: inherit; cursor: pointer; border: none; outline: none;
  transition: opacity .12s, background .12s, transform .08s;
}
button:active { transform: scale(.97); }
button:disabled { opacity: .35; cursor: default; transform: none; }
input, select {
  font-family: inherit;
  background: var(--bg3); color: var(--fg);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 10px 12px; font-size: 15px; width: 100%;
}
input:focus, select:focus { outline: 2px solid var(--accent); border-color: transparent; }
h1 { font-size: 1.5rem; font-weight: 800; }
h2 { font-size: 1.15rem; font-weight: 700; }

/* ─── SCREENS ────────────────────────────────────────── */
.screen { display: none; }
.screen.active { display: flex; flex-direction: column; min-height: 100vh; }

/* ─── TOP BAR ────────────────────────────────────────── */
.topbar {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 16px; background: var(--bg2);
  border-bottom: 1px solid var(--border);
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 100;
}
.topbar-title { font-weight: 700; font-size: 14px; flex: 1; }
.topbar-btn {
  background: var(--bg3); color: var(--fg);
  border-radius: 8px; padding: 6px 12px;
  font-size: 13px; font-weight: 600;
}
.topbar-btn.red { background: var(--red); color: #fff; }

/* ─── SETUP SCREEN ───────────────────────────────────── */
#setup { padding: 24px 0 32px; gap: 20px; }
.setup-logo { text-align: center; padding: 8px 16px; }
.setup-logo span { font-size: 2rem; }
.setup-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 16px; padding: 20px; margin: 0 0; gap: 14px;
  display: flex; flex-direction: column;
}
.form-row { display: flex; flex-direction: column; gap: 6px; }
.form-label { font-size: 12px; font-weight: 600; color: var(--fg2); text-transform: uppercase; letter-spacing: .05em; }
.btn-group { display: flex; gap: 8px; }
.opt-btn {
  flex: 1; padding: 12px 8px; border-radius: 10px;
  background: var(--bg3); color: var(--fg);
  font-size: 14px; font-weight: 600;
  border: 2px solid transparent;
}
.opt-btn.sel { background: var(--accent); color: #fff; border-color: var(--accent); }
.grid-3x2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.start-btn {
  margin: 0; width: 100%; padding: 16px;
  background: var(--green); color: #fff;
  font-size: 17px; font-weight: 800; border-radius: 14px;
}

/* ─── LOG SCREEN (landscape 3-col) ──────────────────── */
#log-screen { padding: 0; height: 100vh; overflow: hidden; }
#log-screen .topbar { flex-shrink: 0; }
.log-body {
  display: grid;
  grid-template-columns: 0.8fr 1.8fr 0.7fr;
  gap: 0;
  height: calc(100vh - 48px - env(safe-area-inset-top, 0px));
  overflow: hidden;
}
.log-col {
  display: flex; flex-direction: column; gap: 6px;
  padding: 8px 6px; border-right: 1px solid var(--border);
  overflow-y: auto; overflow-x: hidden;
}
/* Middle col must NOT scroll — so the FH/BH flex-grow chain reaches the buttons */
.log-body > .log-col:nth-child(2) { overflow: hidden; }
.log-col:last-child { border-right: none; }
.col-label {
  font-size: 10px; font-weight: 700; color: var(--fg2);
  text-transform: uppercase; letter-spacing: .08em;
  padding-bottom: 2px;
}

/* server/side buttons */
.server-btns, .side-btns { display: flex; flex-direction: column; gap: 6px; }
.serve-btn, .side-btn {
  padding: 14px 10px; border-radius: 10px;
  background: var(--bg3); color: var(--fg);
  font-size: 16px; font-weight: 700;
  border: 2px solid transparent; width: 100%;
}
.serve-btn.sel, .side-btn.sel { background: var(--accent); color: #fff; border-color: var(--accent); }

/* amber pulse for unset required */
@keyframes amberpulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(245,158,11,0); }
  50%      { box-shadow: 0 0 0 6px rgba(245,158,11,.45); }
}
.need-tap { animation: amberpulse 1.6s ease-in-out infinite; border-color: var(--amber) !important; }

/* serve outcome */
.outcome-grid { display: flex; flex-direction: column; gap: 6px; }
.out-btn {
  padding: 12px 8px; border-radius: 10px;
  background: var(--bg3); color: var(--fg);
  font-size: 14px; font-weight: 600; width: 100%;
  border: 2px solid transparent;
}
.out-btn.sel { background: var(--accent); color: #fff; border-color: var(--accent); }
.out-btn.df { background: #3d1515; color: #fc8181; border-color: #7f1d1d; }
.out-btn.df.sel { background: var(--red); color: #fff; border-color: var(--red); }
.out-btn.ace.sel { background: var(--green); color: #fff; border-color: var(--green); }

/* middle col: point so far + shots */
.psf-strip {
  display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
  min-height: 36px;
  background: var(--bg3); border-radius: 10px; padding: 8px;
}
.psf-pill {
  padding: 4px 10px; border-radius: 20px;
  font-size: 12px; font-weight: 700; color: #fff;
}
.psf-pill.normal { background: var(--pill-norm); }
.psf-pill.ace { background: var(--pill-ace); }
.psf-pill.df { background: var(--pill-df); }
.psf-pill.fh { background: var(--pill-fh); }
.psf-pill.bh { background: var(--pill-bh); }
.psf-pill.net { background: var(--pill-net); }

.shot-btns { display: flex; flex-direction: column; gap: 6px; flex: 1; min-height: 0; }
.fh-bh-row { display: flex; gap: 6px; flex: 1; min-height: 110px; }
.fh-btn, .bh-btn {
  flex: 1; border-radius: 12px;
  font-size: 32px; font-weight: 800;
  /* height fills .fh-bh-row via align-items:stretch (flex default) */
}
.fh-btn { background: #14532d; color: #86efac; }
.bh-btn { background: #1e3a6e; color: #93c5fd; }
.fh-btn:disabled { background: var(--bg3); color: var(--fg2); }
.bh-btn:disabled { background: var(--bg3); color: var(--fg2); }

.net-row { display: flex; gap: 5px; }
.net-btn {
  flex: 1; padding: 10px 4px; border-radius: 8px;
  font-size: 11px; font-weight: 600;
  background: #2e1065; color: #c4b5fd;
}
.net-btn:disabled { background: var(--bg3); color: var(--fg2); }

/* ace direction */
.ace-dir-btns { display: flex; flex-direction: column; gap: 8px; }
.ace-dir-btn {
  padding: 20px 10px; border-radius: 12px;
  font-size: 17px; font-weight: 800;
  background: var(--bg3); color: var(--fg);
  border: 2px solid var(--border);
  width: 100%;
}
.ace-dir-btn.sel { background: var(--green); color: #fff; border-color: var(--green); }
.ace-dir-other {
  padding: 14px 10px; border-radius: 12px;
  font-size: 13px; font-weight: 600;
  background: var(--bg3); color: var(--fg2);
  border: 2px solid var(--border);
  width: 100%;
}
.ace-dir-other.sel { background: var(--bg3); color: var(--fg); border-color: var(--accent); }

/* right col */
.finish-btn {
  flex: 1; border-radius: 12px;
  background: var(--green); color: #fff;
  font-size: 18px; font-weight: 800;
  padding: 0 12px; min-height: 100px;
  border: none;
}
.finish-btn:disabled { background: var(--bg3); color: var(--fg2); }
.undo-btn {
  padding: 14px; border-radius: 10px;
  background: var(--bg3); color: var(--fg2);
  font-size: 14px; font-weight: 600; width: 100%;
}

/* ─── WHO WON SCREEN ─────────────────────────────────── */
/* IMPORTANT: bare #whowon must NOT set display — it would override .screen{display:none} */
#whowon.active {
  display: grid !important;   /* override .screen.active flex */
  grid-template-columns: 1fr 1.6fr;
  height: 100vh; overflow: hidden;
  gap: 0; padding: 0;
  min-height: 0;
}
.ww-left {
  display: flex; flex-direction: column; gap: 8px; padding: 10px 8px;
  border-right: 1px solid var(--border);
}
.ww-title { font-size: 12px; font-weight: 700; color: var(--fg2); text-transform: uppercase; letter-spacing: .08em; padding-bottom: 2px; }
.whowon-btn {
  flex: 1; border-radius: 12px;
  font-size: 20px; font-weight: 800;
  padding: 0 12px; min-height: 0;
  background: var(--bg3); color: var(--fg); border: 2px solid var(--border);
}
.whowon-btn.ww-sel { background: var(--green); color: #fff; border-color: var(--green); }
.whowon-btn.ww-dim { opacity: 0.35; }
.ww-confirm {
  flex: none; padding: 14px 12px; border-radius: 12px;
  background: var(--accent); color: #fff;
  font-size: 17px; font-weight: 800; width: 100%;
  border: none;
}
.ww-confirm:disabled { background: var(--bg3); color: var(--fg2); }
.ww-right {
  display: flex; flex-direction: column; gap: 6px; padding: 10px 8px;
  overflow-y: auto;
}
.ls-section-label { font-size: 10px; font-weight: 700; color: var(--fg2); text-transform: uppercase; letter-spacing: .08em; }
.ls-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
.ls-btn {
  padding: 8px 4px; border-radius: 8px; font-size: 11px; font-weight: 600;
  background: var(--bg3); color: var(--fg2); border: 2px solid transparent;
  line-height: 1.2; text-align: center;
}
.ls-btn.sel { border-color: var(--accent); color: var(--fg); background: var(--bg2); }
.ls-btn.winner-type { color: #4ade80; }
.ls-btn.error-type { color: #f87171; }
.ls-btn.winner-type.sel { background: #14532d; border-color: var(--green); color: #bbf7d0; }
.ls-btn.error-type.sel { background: #3d1515; border-color: var(--red); color: #fecaca; }

/* ─── POINT LOG SCREEN ───────────────────────────────── */
#pointlog { padding: 0; }
.delete-confirm-bar {
  position: sticky; top: env(safe-area-inset-top, 0px);
  z-index: 200;
  background: #7f1d1d; color: #fff;
  padding: 12px 16px; display: flex; align-items: center; gap: 10px;
  font-size: 14px; font-weight: 600;
}
.delete-confirm-bar span { flex: 1; }
.dc-cancel { background: rgba(255,255,255,.2); color: #fff; padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; }
.dc-confirm { background: #fff; color: var(--red); padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 700; }
.log-list { flex: 1; overflow-y: auto; padding: 8px 0; }
.log-item {
  padding: 10px 16px; border-bottom: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 4px;
  font-size: 13px;
}
.log-item.deleting { background: #3d1515; }
.log-item-row1 { display: flex; align-items: center; gap: 8px; }
.log-num { font-size: 11px; color: var(--fg2); min-width: 24px; }
.log-meta { flex: 1; color: var(--fg2); font-size: 12px; }
.log-winner { font-weight: 700; font-size: 13px; }
.log-shots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
.log-del { background: var(--bg3); color: var(--fg2); padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; }
.empty-log { text-align: center; color: var(--fg2); padding: 48px 16px; font-size: 14px; }

/* ─── ANALYSE SCREEN ─────────────────────────────────── */
#analyse { padding: 0; }
.analyse-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.stat-card {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px;
}
.stat-row { display: flex; justify-content: space-between; align-items: center; }
.stat-label { font-size: 13px; color: var(--fg2); }
.stat-val { font-size: 18px; font-weight: 800; color: var(--fg); }
.stat-bar-wrap { height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
.stat-bar { height: 100%; border-radius: 3px; background: var(--accent); transition: width .5s; }
.coaching-card {
  background: linear-gradient(135deg, #1e1b4b, #312e81);
  border: 1px solid #4338ca; border-radius: 14px; padding: 16px;
  display: flex; flex-direction: column; gap: 6px;
}
.coaching-label { font-size: 11px; font-weight: 700; color: #a5b4fc; text-transform: uppercase; letter-spacing: .08em; }
.coaching-text { font-size: 15px; font-weight: 600; color: #e0e7ff; line-height: 1.5; }

/* ─── END MATCH SCREEN ───────────────────────────────── */
#endmatch { justify-content: center; padding: 24px; gap: 16px; }
#endmatch h1 { text-align: center; }
.end-summary {
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: 16px; padding: 20px; text-align: center;
}
.end-pts { font-size: 3rem; font-weight: 800; color: var(--accent); }
.end-sub { color: var(--fg2); font-size: 14px; margin-top: 4px; }
.end-btns { display: flex; flex-direction: column; gap: 10px; }
.end-btn {
  padding: 16px; border-radius: 14px;
  font-size: 16px; font-weight: 700;
}
.end-btn.primary { background: var(--accent); color: #fff; }
.end-btn.secondary { background: var(--bg3); color: var(--fg); }
.end-back { text-align: center; color: var(--fg2); font-size: 14px; text-decoration: underline; cursor: pointer; background: none; border: none; color: var(--fg2); padding: 8px; }
</style>

<!-- ═══════════════════════════════════════════════════ -->
<!--  SETUP SCREEN                                       -->
<!-- ═══════════════════════════════════════════════════ -->
<div id="setup" class="screen active">
  <div class="setup-logo">
    <h1>🎾 Tennis Logger</h1>
    <p style="color:var(--fg2);font-size:13px;margin-top:4px;">Point-by-point match logging</p>
  </div>
  <div class="setup-card" style="margin:0 0 0 0">
    <div class="form-row">
      <div class="form-label">Player name</div>
      <input id="s-player" type="text" placeholder="e.g. Oliver Prangley" autocomplete="off">
    </div>
    <div class="form-row">
      <div class="form-label">Opponent name</div>
      <input id="s-opp" type="text" placeholder="e.g. Smith" autocomplete="off">
    </div>
    <div class="form-row">
      <div class="form-label">Tournament / Date</div>
      <input id="s-tourn" type="text" placeholder="e.g. ITF Aldershot · Jun 2025" autocomplete="off">
    </div>
    <div class="form-row">
      <div class="form-label">Environment</div>
      <div class="btn-group">
        <button class="opt-btn" data-group="env" data-val="Outdoor" onclick="pickOpt(this)">Outdoor</button>
        <button class="opt-btn" data-group="env" data-val="Indoor" onclick="pickOpt(this)">Indoor</button>
      </div>
    </div>
    <div class="form-row">
      <div class="form-label">Surface</div>
      <div class="grid-3x2">
        <button class="opt-btn" data-group="surf" data-val="Hard" onclick="pickOpt(this)">Hard</button>
        <button class="opt-btn" data-group="surf" data-val="Clay" onclick="pickOpt(this)">Clay</button>
        <button class="opt-btn" data-group="surf" data-val="Grass" onclick="pickOpt(this)">Grass</button>
        <button class="opt-btn" data-group="surf" data-val="Artificial Clay" onclick="pickOpt(this)">Artificial Clay</button>
        <button class="opt-btn" data-group="surf" data-val="Astroturf" onclick="pickOpt(this)">Astroturf</button>
        <button class="opt-btn" data-group="surf" data-val="Carpet" onclick="pickOpt(this)">Carpet</button>
      </div>
    </div>
    <div class="form-row">
      <div class="form-label">Sets format</div>
      <div class="btn-group">
        <button class="opt-btn" data-group="sets" data-val="Best of 3" onclick="pickOpt(this)">Best of 3</button>
        <button class="opt-btn" data-group="sets" data-val="Best of 5" onclick="pickOpt(this)">Best of 5</button>
      </div>
    </div>
    <button class="start-btn" id="start-btn" disabled onclick="startMatch()">Start Match →</button>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════ -->
<!--  LOG SCREEN                                         -->
<!-- ═══════════════════════════════════════════════════ -->
<div id="log-screen" class="screen">
  <div class="topbar">
    <span class="topbar-title" id="topbar-info">Match</span>
    <button class="topbar-btn" onclick="showSet()">Set</button>
    <button class="topbar-btn" onclick="goScreen('pointlog')">Log</button>
    <button class="topbar-btn" onclick="goScreen('analyse')">Stats</button>
    <button class="topbar-btn red" onclick="goScreen('endmatch')">End</button>
  </div>
  <div class="log-body">
    <!-- LEFT COL -->
    <div class="log-col">
      <div class="col-label">Server</div>
      <div class="server-btns">
        <button class="serve-btn need-tap" id="srv-p" onclick="setServer('P')"></button>
        <button class="serve-btn need-tap" id="srv-o" onclick="setServer('O')"></button>
      </div>
      <div class="col-label" style="margin-top:6px">Side</div>
      <div class="side-btns">
        <button class="side-btn need-tap" id="side-d" onclick="setSide('Deuce')">Deuce</button>
        <button class="side-btn need-tap" id="side-a" onclick="setSide('Ad')">Ad</button>
      </div>
      <div class="col-label" style="margin-top:6px">Serve outcome</div>
      <div class="outcome-grid">
        <div class="btn-group">
          <button class="out-btn sel" id="out-1in" onclick="setOutcome('1st in')">1st in</button>
          <button class="out-btn ace" id="out-1ace" onclick="setOutcome('1st ACE')">1st ACE</button>
        </div>
        <div class="btn-group">
          <button class="out-btn" id="out-2in" onclick="setOutcome('2nd in')">2nd in</button>
          <button class="out-btn ace" id="out-2ace" onclick="setOutcome('2nd ACE')">2nd ACE</button>
        </div>
        <button class="out-btn df" id="out-df" onclick="setOutcome('Double fault')">Double fault</button>
      </div>
      <div class="form-row" style="margin-top:6px">
        <div class="form-label">Set</div>
        <select id="set-sel" onchange="setState(this.value)">
          <option value="1st set">1st set</option>
          <option value="2nd set">2nd set</option>
          <option value="3rd set">3rd set</option>
          <option value="Match-tiebreaker">Match-tiebreaker</option>
        </select>
      </div>
    </div>

    <!-- MIDDLE COL -->
    <div class="log-col">
      <div class="col-label">Point so far</div>
      <div class="psf-strip" id="psf-strip">
        <span style="color:var(--fg2);font-size:12px">—</span>
      </div>
      <div class="shot-btns" id="shot-area">
        <!-- normal FH/BH shown by default; replaced by ace-dir when ACE selected -->
        <div id="fbh-area" style="display:flex;flex-direction:column;flex:1;min-height:0;gap:6px">
          <div class="fh-bh-row">
            <button class="fh-btn" id="fh-btn" disabled onclick="addShot('FH')">FH</button>
            <button class="bh-btn" id="bh-btn" disabled onclick="addShot('BH')">BH</button>
          </div>
          <div class="net-row" id="net-row">
            <button class="net-btn" disabled onclick="addShot('FH volley')">FH Vol</button>
            <button class="net-btn" disabled onclick="addShot('Smash')">Smash</button>
            <button class="net-btn" disabled onclick="addShot('BH volley')">BH Vol</button>
          </div>
        </div>
        <div id="ace-dir-area" style="display:none">
          <div class="ace-dir-btns">
            <button class="ace-dir-btn" id="acd-wide" onclick="setAceDir('Wide')">Wide</button>
            <button class="ace-dir-btn" id="acd-t" onclick="setAceDir('T')">T</button>
            <button class="ace-dir-other" id="acd-other" onclick="setAceDir('Other')">Other (net cord, unusual…)</button>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT COL -->
    <div class="log-col" style="gap:8px">
      <button class="finish-btn" id="finish-btn" disabled onclick="pointFinished()">Point<br>Finished</button>
      <button class="undo-btn" id="undo-btn" disabled onclick="undoShot()">↩ Undo</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════ -->
<!--  WHO WON SCREEN                                     -->
<!-- ═══════════════════════════════════════════════════ -->
<div id="whowon" class="screen">
  <div class="ww-left">
    <div class="ww-title">Who won?</div>
    <button class="whowon-btn" id="ww-p" onclick="selectWinner('P')"></button>
    <button class="whowon-btn" id="ww-o" onclick="selectWinner('O')"></button>
    <button class="ww-confirm" id="ww-confirm" onclick="commitPoint()" disabled>Log Point →</button>
  </div>
  <div class="ww-right">
    <div class="ls-section-label">Last shot — optional</div>
    <div class="ls-section-label" style="color:#4ade80;margin-top:4px">Winners</div>
    <div class="ls-grid" id="ls-winners"></div>
    <div class="ls-section-label" style="color:#f87171;margin-top:6px">Errors</div>
    <div class="ls-grid" id="ls-errors"></div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════════ -->
<!--  POINT LOG SCREEN                                   -->
<!-- ═══════════════════════════════════════════════════ -->
<div id="pointlog" class="screen">
  <div class="topbar">
    <span class="topbar-title">Point Log</span>
    <button class="topbar-btn" onclick="goScreen('log-screen')">← Back</button>
  </div>
  <div id="del-confirm" class="delete-confirm-bar" style="display:none">
    <span id="del-confirm-text"></span>
    <button class="dc-cancel" onclick="cancelDelete()">Cancel</button>
    <button class="dc-confirm" onclick="confirmDelete()">Yes, delete</button>
  </div>
  <div class="log-list" id="log-list"></div>
</div>

<!-- ═══════════════════════════════════════════════════ -->
<!--  ANALYSE SCREEN                                     -->
<!-- ═══════════════════════════════════════════════════ -->
<div id="analyse" class="screen">
  <div class="topbar">
    <span class="topbar-title">Live Stats</span>
    <button class="topbar-btn" onclick="goScreen('log-screen')">← Back</button>
  </div>
  <div class="analyse-body" id="analyse-body"></div>
</div>

<!-- ═══════════════════════════════════════════════════ -->
<!--  END MATCH SCREEN                                   -->
<!-- ═══════════════════════════════════════════════════ -->
<div id="endmatch" class="screen">
  <h1>End Match</h1>
  <div class="end-summary">
    <div class="end-pts" id="end-pts">—</div>
    <div class="end-sub" id="end-sub">points logged</div>
    <div id="end-win" style="margin-top:8px;font-size:1.1rem;font-weight:700"></div>
  </div>
  <div class="end-btns">
    <button class="end-btn primary" onclick="goScreen('analyse')">Quick Stats</button>
    <button class="end-btn secondary" onclick="downloadCSV()">⬇ Download CSV</button>
  </div>
  <button class="end-back" onclick="goScreen('log-screen')">Not finished — back to logging</button>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let match = {
  playerName: '',
  opp: '', tourn: '', env: '', surface: '', sets: '',
  points: []
};

// Current point state
let cur = {
  server: null,    // 'P' or 'O'
  side: null,      // 'Deuce' or 'Ad'
  set: '1st set',
  outcome: '1st in',
  aceDir: null,
  shots: [],
  lastShot: '',
};

const LS_WINNERS = [
  'FH winner','BH winner',
  'Return FH winner','Return BH winner',
  'Volley FH winner','Volley BH winner',
  'Passing FH winner','Passing BH winner',
  'Lob FH winner','Lob BH winner',
  'Smash winner','Dead net cord winner'
];
const LS_ERRORS = [
  'FH unforced error','BH unforced error',
  'FH forced error','BH forced error',
  'Return FH unforced error','Return BH unforced error',
  'Return FH forced error','Return BH forced error',
  'Volley FH error','Volley BH error',
  'Passing FH unforced error','Passing BH unforced error',
  'Lob FH error','Lob BH error',
  'Smash error'
];

function buildLastShotGrids() {
  function makeGrid(containerId, shots, cls) {
    const el = document.getElementById(containerId);
    el.innerHTML = '';
    shots.forEach(s => {
      const b = document.createElement('button');
      b.className = `ls-btn ${cls}`;
      b.textContent = s
        .replace(' winner','').replace(' unforced error',' UFE').replace(' forced error',' FE')
        .replace(' error',' E');
      b.title = s;
      b.onclick = () => toggleLastShot(s, b);
      el.appendChild(b);
    });
  }
  makeGrid('ls-winners', LS_WINNERS, 'winner-type');
  makeGrid('ls-errors',  LS_ERRORS,  'error-type');
}

function toggleLastShot(val, btn) {
  cur.lastShot = cur.lastShot === val ? '' : val;
  document.querySelectorAll('.ls-btn').forEach(b => b.classList.remove('sel'));
  if (cur.lastShot) btn.classList.add('sel');
}

let pendingDeleteIdx = null;

// ═══════════════════════════════════════════════════════
//  SCREEN NAV
// ═══════════════════════════════════════════════════════
function goScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 'pointlog') renderLog();
  if (id === 'analyse') renderAnalyse();
  if (id === 'endmatch') renderEndMatch();
  if (id === 'whowon') {
    pendingWinner = null;
    ['ww-p','ww-o'].forEach(bid => {
      const b = document.getElementById(bid);
      b.classList.remove('ww-sel','ww-dim');
    });
    document.getElementById('ww-confirm').disabled = true;
  }
}

// ═══════════════════════════════════════════════════════
//  SETUP
// ═══════════════════════════════════════════════════════
let setupVals = { env: null, surf: null, sets: null };

function pickOpt(btn) {
  const group = btn.dataset.group;
  document.querySelectorAll(`[data-group="${group}"]`).forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  if (group === 'env') setupVals.env = btn.dataset.val;
  if (group === 'surf') setupVals.surf = btn.dataset.val;
  if (group === 'sets') setupVals.sets = btn.dataset.val;
  checkStartEnabled();
}

function checkStartEnabled() {
  const p = document.getElementById('s-player').value.trim();
  const o = document.getElementById('s-opp').value.trim();
  const ok = p && o && setupVals.env && setupVals.surf && setupVals.sets;
  document.getElementById('start-btn').disabled = !ok;
}

['s-player','s-opp','s-tourn'].forEach(id => {
  document.getElementById(id).addEventListener('input', checkStartEnabled);
});

function startMatch() {
  match.playerName = document.getElementById('s-player').value.trim();
  match.opp   = document.getElementById('s-opp').value.trim();
  match.tourn = document.getElementById('s-tourn').value.trim();
  match.env   = setupVals.env;
  match.surface = setupVals.surf;
  match.sets  = setupVals.sets;
  match.points = [];

  // Set server buttons labels
  document.getElementById('srv-p').textContent = match.playerName;
  document.getElementById('srv-o').textContent = match.opp;
  document.getElementById('ww-p').textContent  = match.playerName;
  document.getElementById('ww-o').textContent  = match.opp;
  document.getElementById('topbar-info').textContent =
    `${match.playerName} vs ${match.opp}`;

  buildLastShotGrids();
  resetPoint();
  goScreen('log-screen');
  loadSavedMatch();
}

function loadSavedMatch() {
  try {
    const saved = localStorage.getItem('tl_match');
    if (saved) {
      const d = JSON.parse(saved);
      // only load if same player
      if (d.playerName === match.playerName) {
        if (confirm(`Resume ${d.points.length} saved points?`)) {
          match.points = d.points;
        }
      }
    }
  } catch(e){}
}

function saveMatch() {
  try { localStorage.setItem('tl_match', JSON.stringify(match)); } catch(e){}
}

// ═══════════════════════════════════════════════════════
//  LOGGING
// ═══════════════════════════════════════════════════════
function resetPoint() {
  cur = {
    server: null, side: null,
    set: document.getElementById('set-sel').value,
    outcome: '1st in',
    aceDir: null, shots: [], lastShot: ''
  };
  document.querySelectorAll('.ls-btn').forEach(b => b.classList.remove('sel'));

  // server buttons: clear selection, re-enable pulse
  ['srv-p','srv-o'].forEach(id => {
    const b = document.getElementById(id);
    b.classList.remove('sel');
    b.classList.add('need-tap');
  });
  ['side-d','side-a'].forEach(id => {
    const b = document.getElementById(id);
    b.classList.remove('sel');
    b.classList.add('need-tap');
  });

  // Outcome default
  document.querySelectorAll('.out-btn').forEach(b => b.classList.remove('sel'));
  document.getElementById('out-1in').classList.add('sel');

  // Lock shots + finish until server+side set
  setShotLock(true);

  updatePSF();
  showAceDir(false);
  document.getElementById('finish-btn').disabled = true;
  document.getElementById('undo-btn').disabled = true;
}

function setServer(who) {
  cur.server = who;
  document.getElementById('srv-p').classList.toggle('sel', who==='P');
  document.getElementById('srv-o').classList.toggle('sel', who==='O');
  document.getElementById('srv-p').classList.remove('need-tap');
  document.getElementById('srv-o').classList.remove('need-tap');
  checkPointReady();
}

function setSide(side) {
  cur.side = side;
  document.getElementById('side-d').classList.toggle('sel', side==='Deuce');
  document.getElementById('side-a').classList.toggle('sel', side==='Ad');
  document.getElementById('side-d').classList.remove('need-tap');
  document.getElementById('side-a').classList.remove('need-tap');
  checkPointReady();
}

function setState(val) { cur.set = val; }
function showSet() {
  const sel = document.getElementById('set-sel');
  sel.focus();
}

function checkPointReady() {
  if (cur.server && cur.side) {
    setShotLock(false);
    // unlock serve outcome buttons
    document.querySelectorAll('.out-btn').forEach(b => b.disabled = false);
    updateFinishBtn();
  }
}

function setShotLock(locked) {
  document.getElementById('fh-btn').disabled = locked;
  document.getElementById('bh-btn').disabled = locked;
  document.querySelectorAll('.net-btn').forEach(b => b.disabled = locked);
  document.querySelectorAll('.out-btn').forEach(b => b.disabled = locked);
}

function setOutcome(val) {
  cur.outcome = val;
  cur.aceDir = null;
  cur.shots = [];
  document.querySelectorAll('.out-btn').forEach(b => b.classList.remove('sel'));
  const idMap = {
    '1st in':'out-1in', '1st ACE':'out-1ace',
    '2nd in':'out-2in', '2nd ACE':'out-2ace',
    'Double fault':'out-df'
  };
  const btn = document.getElementById(idMap[val]);
  if (btn) btn.classList.add('sel');

  const isAce = val === '1st ACE' || val === '2nd ACE';
  const isDF  = val === 'Double fault';

  showAceDir(isAce);
  updatePSF();

  if (isDF) {
    // auto-log: returner wins, no input needed
    const winner = cur.server === 'P' ? 'O' : 'P';
    logPoint(winner);
    return;
  }

  if (isAce) {
    // Finish blocked until ace dir chosen
    document.getElementById('finish-btn').disabled = true;
  } else {
    updateFinishBtn();
  }
}

function showAceDir(show) {
  document.getElementById('fbh-area').style.display = show ? 'none' : '';
  document.getElementById('ace-dir-area').style.display = show ? '' : 'none';
  if (!show) {
    ['acd-wide','acd-t','acd-other'].forEach(id =>
      document.getElementById(id).classList.remove('sel'));
  }
}

function setAceDir(dir) {
  cur.aceDir = dir;
  ['acd-wide','acd-t','acd-other'].forEach(id =>
    document.getElementById(id).classList.remove('sel'));
  const map = { Wide:'acd-wide', T:'acd-t', Other:'acd-other' };
  document.getElementById(map[dir]).classList.add('sel');
  updatePSF();
  // ACE: auto winner = server
  document.getElementById('finish-btn').disabled = false;
}

const SHOT_LABELS = {
  'FH':'FH', 'BH':'BH',
  'FH volley':'FH Vol', 'BH volley':'BH Vol', 'Smash':'Smash'
};
const SHOT_CLASS = {
  'FH':'fh', 'BH':'bh',
  'FH volley':'net','BH volley':'net','Smash':'net'
};

const MAX_SHOTS = 4; // Return, S+1, R+1, S+2

function addShot(type) {
  if (cur.shots.length >= MAX_SHOTS) return;
  cur.shots.push(type);
  updatePSF();
  updateFinishBtn();
  // lock shots if max reached
  if (cur.shots.length >= MAX_SHOTS) {
    document.getElementById('fh-btn').disabled = true;
    document.getElementById('bh-btn').disabled = true;
    document.querySelectorAll('.net-btn').forEach(b => b.disabled = true);
  }
  document.getElementById('undo-btn').disabled = false;
}

function updatePSF() {
  const strip = document.getElementById('psf-strip');
  strip.innerHTML = '';

  // Serve pill
  const isAce = cur.outcome === '1st ACE' || cur.outcome === '2nd ACE';
  const isDF  = cur.outcome === 'Double fault';
  const pill = document.createElement('span');
  pill.className = 'psf-pill ' + (isAce ? 'ace' : isDF ? 'df' : 'normal');
  pill.textContent = cur.outcome;
  strip.appendChild(pill);

  if (isAce && cur.aceDir) {
    const dp = document.createElement('span');
    dp.className = 'psf-pill ace';
    dp.textContent = cur.aceDir;
    strip.appendChild(dp);
  }

  cur.shots.forEach(s => {
    const sp = document.createElement('span');
    sp.className = 'psf-pill ' + (SHOT_CLASS[s] || 'fh');
    sp.textContent = SHOT_LABELS[s] || s;
    strip.appendChild(sp);
  });
}

function updateFinishBtn() {
  const isAce = cur.outcome === '1st ACE' || cur.outcome === '2nd ACE';
  const isDF  = cur.outcome === 'Double fault';
  if (isDF) { document.getElementById('finish-btn').disabled = true; return; }
  if (isAce) {
    document.getElementById('finish-btn').disabled = !cur.aceDir;
    return;
  }
  // Normal: can finish any time server+side set
  document.getElementById('finish-btn').disabled = !(cur.server && cur.side);
}

function pointFinished() {
  const isAce = cur.outcome === '1st ACE' || cur.outcome === '2nd ACE';
  if (isAce) {
    logPoint(cur.server); // server wins ace
  } else {
    cur.lastShot = '';
    document.querySelectorAll('.ls-btn').forEach(b => b.classList.remove('sel'));
    goScreen('whowon');
  }
}

let pendingWinner = null;

function selectWinner(who) {
  pendingWinner = who;
  const pBtn = document.getElementById('ww-p');
  const oBtn = document.getElementById('ww-o');
  const confirmBtn = document.getElementById('ww-confirm');
  pBtn.classList.toggle('ww-sel', who === 'P');
  pBtn.classList.toggle('ww-dim', who === 'O');
  oBtn.classList.toggle('ww-sel', who === 'O');
  oBtn.classList.toggle('ww-dim', who === 'P');
  confirmBtn.disabled = false;
}

function commitPoint() {
  if (!pendingWinner) return;
  logPoint(pendingWinner);
  goScreen('log-screen');
}

const SHOT_SEQUENCE_COLS = ['Return','Serve+1','Return+1','Serve+2'];

function logPoint(winnerCode) {
  const winnerName = winnerCode === 'P' ? match.playerName : match.opp;
  const serverName = cur.server === 'P' ? match.playerName : match.opp;

  const row = {
    Set: cur.set,
    Server: serverName,
    Side: cur.side,
    'Serve outcome': cur.outcome,
    'ACE direction': cur.aceDir || '',
    Return: cur.shots[0] || '',
    'Serve+1': cur.shots[1] || '',
    'Return+1': cur.shots[2] || '',
    'Serve+2': cur.shots[3] || '',
    'Last shot': cur.lastShot || '',
    Winner: winnerName,
    _winCode: winnerCode,
    _serverCode: cur.server
  };
  match.points.push(row);
  saveMatch();
  resetPoint();
}

function undoShot() {
  if (cur.shots.length > 0) {
    cur.shots.pop();
    updatePSF();
    // re-enable shot buttons if was at max
    if (cur.shots.length < MAX_SHOTS && cur.server && cur.side) {
      document.getElementById('fh-btn').disabled = false;
      document.getElementById('bh-btn').disabled = false;
      document.querySelectorAll('.net-btn').forEach(b => b.disabled = false);
    }
  } else if (cur.aceDir) {
    cur.aceDir = null;
    ['acd-wide','acd-t','acd-other'].forEach(id =>
      document.getElementById(id).classList.remove('sel'));
    updatePSF();
    document.getElementById('finish-btn').disabled = true;
  }
  document.getElementById('undo-btn').disabled =
    cur.shots.length === 0 && !cur.aceDir;
}

// ═══════════════════════════════════════════════════════
//  POINT LOG
// ═══════════════════════════════════════════════════════
function renderLog() {
  const list = document.getElementById('log-list');
  list.innerHTML = '';
  if (match.points.length === 0) {
    list.innerHTML = '<div class="empty-log">No points logged yet.</div>';
    return;
  }
  match.points.forEach((pt, i) => {
    const div = document.createElement('div');
    div.className = 'log-item' + (pendingDeleteIdx === i ? ' deleting' : '');
    div.id = 'log-item-' + i;

    const shots = [pt.Return, pt['Serve+1'], pt['Return+1'], pt['Serve+2']]
      .filter(Boolean);
    const isAce = pt['Serve outcome'].includes('ACE');
    const isDF  = pt['Serve outcome'] === 'Double fault';

    let psfHtml = `<span class="psf-pill ${isAce?'ace':isDF?'df':'normal'}" style="font-size:11px">${pt['Serve outcome']}</span>`;
    if (pt['ACE direction']) psfHtml += ` <span class="psf-pill ace" style="font-size:11px">${pt['ACE direction']}</span>`;
    shots.forEach(s => {
      const cls = SHOT_CLASS[s] || 'fh';
      psfHtml += ` <span class="psf-pill ${cls}" style="font-size:11px">${SHOT_LABELS[s]||s}</span>`;
    });

    div.innerHTML = `
      <div class="log-item-row1">
        <span class="log-num">#${i+1}</span>
        <span class="log-meta">${pt.Set} · ${pt.Server.split(' ').pop()} serving · ${pt.Side}</span>
        <span class="log-winner" style="color:${pt._winCode==='P'?'var(--green)':'var(--fg2)'}">${pt.Winner.split(' ').pop()} won</span>
        <button class="log-del" onclick="askDelete(${i})">Delete</button>
      </div>
      <div class="log-shots">${psfHtml}</div>
    `;
    list.appendChild(div);
  });

  // update delete bar
  if (pendingDeleteIdx !== null) {
    const pt = match.points[pendingDeleteIdx];
    document.getElementById('del-confirm-text').textContent =
      `Delete point #${pendingDeleteIdx+1} (${pt.Side} · ${pt['Serve outcome']})?`;
    document.getElementById('del-confirm').style.display = 'flex';
  } else {
    document.getElementById('del-confirm').style.display = 'none';
  }
}

function askDelete(i) {
  pendingDeleteIdx = i;
  renderLog();
}
function cancelDelete() {
  pendingDeleteIdx = null;
  renderLog();
}
function confirmDelete() {
  if (pendingDeleteIdx !== null) {
    match.points.splice(pendingDeleteIdx, 1);
    saveMatch();
    pendingDeleteIdx = null;
    renderLog();
  }
}

// ═══════════════════════════════════════════════════════
//  ANALYSE
// ═══════════════════════════════════════════════════════
function renderAnalyse() {
  const body = document.getElementById('analyse-body');
  const pts = match.points;
  const playerFullName = match.playerName;
  const n = pts.length;

  if (n === 0) {
    body.innerHTML = '<div style="text-align:center;color:var(--fg2);padding:40px">No points yet.</div>';
    return;
  }

  const won = pts.filter(p => p._winCode === 'P').length;
  const pWon = pct(won, n);

  // 1st serve stats
  const has1st = pts.filter(p =>
    p['Serve outcome']==='1st in' || p['Serve outcome']==='1st ACE');
  const tot1st = pts.filter(p => p._serverCode === 'P').length;
  const p1stIn = pts.filter(p => p._serverCode==='P' &&
    (p['Serve outcome']==='1st in' || p['Serve outcome']==='1st ACE')).length;
  const p1stPct = pct(p1stIn, tot1st);

  // serve win %
  const pServing = pts.filter(p => p._serverCode === 'P');
  const pServeWon = pServing.filter(p => p._winCode === 'P').length;
  const pServePct = pct(pServeWon, pServing.length);

  // return win %
  const pReturning = pts.filter(p => p._serverCode === 'O');
  const pRetWon = pReturning.filter(p => p._winCode === 'P').length;
  const pRetPct = pct(pRetWon, pReturning.length);

  // DFs
  const pDFs = pts.filter(p => p._serverCode==='P' && p['Serve outcome']==='Double fault').length;

  // coaching point
  const coaching = getCoachingPoint(pts, playerFullName);

  body.innerHTML = `
    <div class="stat-card">
      <div class="stat-row">
        <span class="stat-label">Points won (${won}/${n})</span>
        <span class="stat-val">${pWon}%</span>
      </div>
      <div class="stat-bar-wrap"><div class="stat-bar" style="width:${pWon}%"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-row">
        <span class="stat-label">1st serve in (${p1stIn}/${tot1st})</span>
        <span class="stat-val">${p1stPct}%</span>
      </div>
      <div class="stat-bar-wrap"><div class="stat-bar" style="width:${p1stPct}%"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-row">
        <span class="stat-label">Serve win % (${pServeWon}/${pServing.length})</span>
        <span class="stat-val">${pServePct}%</span>
      </div>
      <div class="stat-bar-wrap"><div class="stat-bar" style="width:${pServePct}%"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-row">
        <span class="stat-label">Return win % (${pRetWon}/${pReturning.length})</span>
        <span class="stat-val">${pRetPct}%</span>
      </div>
      <div class="stat-bar-wrap"><div class="stat-bar" style="width:${pRetPct}%"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-row">
        <span class="stat-label">Double faults</span>
        <span class="stat-val" style="color:var(--red)">${pDFs}</span>
      </div>
    </div>
    <div class="coaching-card">
      <div class="coaching-label">🎯 Coaching point</div>
      <div class="coaching-text">${coaching}</div>
    </div>
  `;
}

function pct(n, d) {
  if (!d) return 0;
  return Math.round(100 * n / d);
}

function getCoachingPoint(pts, playerName) {
  const serving = pts.filter(p => p._serverCode === 'P');
  const returning = pts.filter(p => p._serverCode === 'O');

  // DF check
  const dfs = serving.filter(p => p['Serve outcome'] === 'Double fault').length;
  if (dfs >= 3) return `${dfs} double faults so far — prioritise getting the second serve in.`;

  // 1st serve in %
  const s1in = serving.filter(p => ['1st in','1st ACE'].includes(p['Serve outcome'])).length;
  const s1pct = pct(s1in, serving.length);
  if (s1pct < 50 && serving.length >= 8)
    return `1st serve % is only ${s1pct}% — take a little pace off to get more in.`;

  // Return win check
  const retWon = pct(returning.filter(p => p._winCode === 'P').length, returning.length);
  const serveWon = pct(serving.filter(p => p._winCode === 'P').length, serving.length);
  if (retWon < 30 && returning.length >= 6)
    return `Return win rate is ${retWon}% — look for patterns in serve direction and step up on returns.`;
  if (serveWon < 50 && serving.length >= 6)
    return `Serve win rate is ${serveWon}% — focus on 1st serve placement to take control of the rally.`;

  // BH shot patterns
  const bhReturns = returning.filter(p => p.Return === 'BH');
  const bhRetWon  = pct(bhReturns.filter(p => p._winCode === 'P').length, bhReturns.length);
  if (bhReturns.length >= 5 && bhRetWon >= 60)
    return `BH return is working well at ${bhRetWon}% — keep targeting that side on return games.`;

  const fhReturns = returning.filter(p => p.Return === 'FH');
  const fhRetWon  = pct(fhReturns.filter(p => p._winCode === 'P').length, fhReturns.length);
  if (fhReturns.length >= 5 && fhRetWon < 40)
    return `FH return is winning only ${fhRetWon}% — consider switching to a more neutral BH return.`;

  if (pts.length < 10) return `Keep logging — coaching insights appear after more points are recorded.`;
  return `Good all-round performance so far. Focus on 1st serve consistency and return placement.`;
}

// ═══════════════════════════════════════════════════════
//  END MATCH / CSV
// ═══════════════════════════════════════════════════════
function renderEndMatch() {
  const n = match.points.length;
  const won = match.points.filter(p => p._winCode === 'P').length;
  document.getElementById('end-pts').textContent = n;
  document.getElementById('end-sub').textContent = 'points logged';
  document.getElementById('end-win').textContent = n > 0
    ? `${match.playerName}: ${won} won (${pct(won,n)}%)`
    : '';
}

function downloadCSV() {
  const cols = ['Set','Server','Side','Serve outcome','ACE direction',
                'Return','Serve+1','Return+1','Serve+2','Last shot','Winner'];
  const header = cols.join(',');
  const rows = match.points.map(pt => {
    return cols.map(c => {
      const v = String(pt[c] || '');
      return v.includes(',') ? `"${v}"` : v;
    }).join(',');
  });
  const csv = [header, ...rows].join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const fname = `${match.playerName}_${match.opp}_${match.tourn || 'match'}.csv`
    .replace(/[^a-z0-9_\-\.]/gi,'_');
  a.download = fname;
  a.click();
  URL.revokeObjectURL(url);
}
